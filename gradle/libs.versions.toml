# Shared version catalog for every Mixu Kotlin repository.
#
# One file, imported by each repository's settings.gradle.kts through the
# build-logic checkout. Bumping a version here moves every consumer, so a bump is
# one reviewable commit in this repository plus a submodule pin bump in each
# consumer.
#
# Rule: only versions belong in [versions]; a consumer never writes a version
# number in its own build.gradle.kts.

[versions]
kotlin = "2.4.21"
agp = "9.0.0"
coroutines = "1.10.2"
serialization = "1.9.0"
ktor = "3.3.1"
sqldelight = "2.1.0"
readium = "3.1.0"
compose-multiplatform = "1.9.0"
junit = "5.13.4"
turbine = "1.2.1"
kotest = "6.0.3"

# Android SDK versions, single-sourced here per mixu-docs OQ-01 / ADR-004.
android-compileSdk = "35"
android-minSdk = "26"
android-targetSdk = "35"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.7.1" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.13.4" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }

# Plugin artifacts, for convention plugins to depend on. `[plugins]` below is for
# consumer build scripts.
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
